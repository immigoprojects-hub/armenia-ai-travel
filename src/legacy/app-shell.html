<div class="app-shell">
  <main>
    <section class="screen active screen-dark" id="homeScreen" data-title="Today">
      <div id="todayRoot"><div class="empty"><p>Preparing your Armenia trip…</p></div></div>
    </section>

    <section class="screen" id="plannerScreen" data-title="Planner">
      <div id="plannerRoot" class="screen-pad"></div>
    </section>

    <section class="screen" id="tripScreen" data-title="My Trip">
      <div id="tripRoot" class="screen-pad"></div>
    </section>

    <section class="screen map-screen" id="mapScreen" data-title="Map">
      <div id="mapCanvas" class="map-canvas" aria-label="Trip map"></div>
      <div class="map-top" id="mapTop"></div>
      <div class="map-sheet" id="mapSheet" data-state="half">
        <div class="sheet-handle" id="mapSheetHandle" role="button" aria-label="Drag itinerary sheet"><span></span></div>
        <div class="sheet-body" id="mapSheetBody"></div>
      </div>
    </section>

    <section class="screen" id="dealsScreen" data-title="Deals">
      <div id="dealsRoot" class="screen-pad"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" type="button" data-screen="homeScreen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Today</button>
    <button class="nav-item" type="button" data-screen="plannerScreen"><svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg>Planner</button>
    <button class="nav-item" type="button" data-screen="tripScreen"><svg viewBox="0 0 24 24"><path d="M5 20V5l7 3 7-3v15l-7-3-7 3Z"/></svg>My Trip</button>
    <button class="nav-item" type="button" data-screen="mapScreen"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 1 1 13 0c0 4.8-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>Map</button>
    <button class="nav-item" type="button" data-screen="dealsScreen"><svg viewBox="0 0 24 24"><path d="M4 12V4h8l8 8-8 8-8-8Z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>Deals</button>
  </nav>
</div>

<dialog id="conciergeDialog" class="dialog">
  <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
  <div class="dialog-scroll concierge">
    <p class="eyebrow">Armenia AI</p>
    <h2 class="display-sm">Ask about your trip</h2>
    <div class="chat-log" id="chatLog"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" type="text" placeholder="Rainy day, kids, wine, a driver…" />
      <button type="submit">Send</button>
    </form>
  </div>
</dialog>

<dialog id="entityDialog" class="dialog entity-dialog">
  <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
  <div class="dialog-scroll" id="entityDetail"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
