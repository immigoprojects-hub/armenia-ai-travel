<div class="app-shell">
  <main>
    <section class="screen active" id="homeScreen" data-title="Today">
      <div id="todayRoot">
        <div class="empty"><p>Preparing your Armenia trip…</p></div>
      </div>
    </section>

    <section class="screen" id="plannerScreen" data-title="Planner">
      <div id="plannerRoot" class="screen-pad"></div>
    </section>

    <section class="screen" id="tripScreen" data-title="My Trip">
      <div id="tripRoot" class="screen-pad"></div>
    </section>

    <section class="screen map-screen" id="mapScreen" data-title="Map">
      <div id="mapCanvas" class="map-canvas" aria-label="Trip map"></div>
      <div class="map-top" id="mapTop"></div>
      <div class="map-sheet" id="mapSheet" data-state="half">
        <div
          class="sheet-handle"
          id="mapSheetHandle"
          role="button"
          aria-label="Drag itinerary sheet"
        >
          <span></span>
        </div>
        <div class="sheet-body" id="mapSheetBody"></div>
      </div>
    </section>

    <section class="screen" id="exploreScreen" data-title="Explore">
      <div id="exploreRoot" class="screen-pad"></div>
    </section>

    <section class="screen" id="dealsScreen" data-title="Deals">
      <div id="dealsRoot" class="screen-pad"></div>
    </section>
  </main>
  <button class="ara-float" data-open-concierge aria-label="Ask Ara">
    <img src="__ARA_IMAGE__" alt="Ara" width="1024" height="1024" /><span data-i18n="Ask Ara"
      >Ask Ara</span
    ><i></i>
  </button>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" type="button" data-screen="homeScreen">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.5V12l3 2" /></svg
      >Today
    </button>
    <button class="nav-item" type="button" data-screen="exploreScreen">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="m15.5 8.5-2 5-5 2 2-5 5-2Z" /></svg
      >Explore
    </button>
    <button class="nav-ara" type="button" data-open-concierge aria-label="Ask Ara">
      <img src="__ARA_IMAGE__" alt="" width="1024" height="1024" /><span>Ara</span>
    </button>
    <button class="nav-item" type="button" data-screen="dealsScreen">
      <svg viewBox="0 0 24 24">
        <path d="M4 12V4h8l8 8-8 8-8-8Z" />
        <circle cx="8.5" cy="8.5" r="1.3" /></svg
      >Deals
    </button>
    <button class="nav-item" type="button" data-screen="tripScreen">
      <svg viewBox="0 0 24 24"><path d="M5 20V5l7 3 7-3v15l-7-3-7 3Z" /></svg>My Trip
    </button>
  </nav>
</div>

<dialog id="conciergeDialog" class="dialog">
  <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
  <div class="dialog-scroll concierge">
    <div class="ara-chat-head">
      <img src="__ARA_IMAGE__" alt="Ara" width="1024" height="1024" />
      <div>
        <p class="eyebrow">HAIQ · ARA</p>
        <h2 class="display-sm" data-i18n="Your local friend">Your local friend</h2>
      </div>
    </div>
    <p class="mock-note" data-i18n="Sample replies · not live AI">Sample replies · not live AI</p>
    <div class="chat-log" id="chatLog"></div>
    <form id="chatForm" class="chat-form">
      <input
        id="chatInput"
        type="text"
        placeholder="Ask Ara about Armenia…"
        aria-label="Message Ara"
      />
      <button type="submit" aria-label="Send message">↑</button>
    </form>
  </div>
</dialog>

<dialog id="dealStoryDialog" class="deal-story-dialog" aria-label="Deal story">
  <div id="dealStoryBody" class="deal-story-body"></div>
  <form method="dialog"><button class="story-close" aria-label="Close">×</button></form>
</dialog>

<dialog id="haiqDialog" class="dialog haiq-dialog" aria-label="HAIQ guide">
  <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
  <div class="dialog-scroll" id="haiqDetail"></div>
</dialog>

<dialog id="entityDialog" class="dialog entity-dialog">
  <form method="dialog"><button class="dialog-close" aria-label="Close">×</button></form>
  <div class="dialog-scroll" id="entityDetail"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
