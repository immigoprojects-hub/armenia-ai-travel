name: iOS

# Proves the Capacitor iOS app compiles and launches (unsigned simulator build).
# macOS runners are expensive, so this only runs when native-relevant files change.
on:
  pull_request:
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-native.mjs"
      - "scripts/ios-screen-text.swift"
      - "public/legacy/native.*"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-native.mjs"
      - "scripts/ios-screen-text.swift"
      - "public/legacy/native.*"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Build web bundle and sync iOS project
        run: npm run build:native
      - name: Build app for iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Launch in simulator and screenshot
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$udid" com.armeniaai.travel
          sleep 20
          mkdir -p screenshots
          xcrun simctl io "$udid" screenshot screenshots/launch.png
      - name: Check the first screen rendered
        run: |
          swift scripts/ios-screen-text.swift screenshots/launch.png | tee screenshots/launch.txt
          grep -qi "day 1 of" screenshots/launch.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshot
          path: screenshots/
